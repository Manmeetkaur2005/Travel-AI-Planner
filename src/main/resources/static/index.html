<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Planner ✈️</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="glass-card">
    <h1>✨ AI Travel Planner</h1>

    <form id="travelForm">
        <div class="input-group">
            <label for="source">📍 From (Source Location)</label>
            <input type="text" id="source" placeholder="e.g. Delhi, Mumbai" required>
        </div>

        <div class="mb-3">
            <label>📍 Destination</label>
            <input type="text" class="form-control" id="destination" placeholder="Where do you want to go?" required>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label>⏳ Duration (e.g. 3 Days)</label>
                <input type="text" class="form-control" id="duration" placeholder="How long?" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>💰 Budget (e.g. 5000 INR)</label>
                <input type="text" class="form-control" id="budget" placeholder="Your limit?" required>
            </div>
        </div>

        <div class="mb-3">
            <label>❤️ Interests</label>
            <input type="text" class="form-control" id="interests" placeholder="Beaches, History, Food, Party...">
        </div>

        <button type="submit" class="btn btn-glow">Generate My Plan 🚀</button>
    </form>

    <div id="loading" style="display: none;">
        <p>Connecting to AI... Please wait 🤖</p>
    </div>

    <div class="result-box" id="result">
        <div id="markdown-content"></div>
    </div>
</div>

<script src="script.js?v=2"></script>

</body>
</html>
